name: Stellen aktualisieren

on:
  schedule:
    # 04:30 und 12:30 UTC = 05:30/13:30 Uhr im Winter, 06:30/14:30 Uhr im Sommer (Schweiz)
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stellen abrufen
        run: python scraper/fetch_jobs.py

      - name: Änderungen speichern
        run: |
          git config user.name "stellen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json docs/plz.json scraper/cache/details.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stellen aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
